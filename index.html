<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BNB AIRDROP 2025 — Live Global Distribution</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/dist/fflate.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --text: #fff;
            --gold: #f3ba2f;
            --blue: #00aaff;
            --green: #00ff00;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            position: relative;
        }
        #globe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 100;
            border-bottom: 1px solid var(--gold);
        }
        .logo {
            display: flex;
            align-items: center;
            font: 900 1.6em 'Orbitron', sans-serif;
            color: var(--text);
        }
        .logo .coin {
            width: 28px;
            height: 28px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #000;
            margin-right: 8px;
        }
        .logo span {
            background: linear-gradient(180deg, #fff, #f3ba2f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-left: 8px;
        }
        nav a {
            color: var(--text);
            text-decoration: none;
            font-size: 0.95em;
            margin: 0 10px;
        }
        nav a:hover, nav a.active {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(243, 186, 47, 0.7);
        }
        .connect-btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px 40px;
            text-align: center;
            position: relative;
            z-index: 10;
            min-height: 100vh;
        }
        .hero h1 {
            color: var(--gold);
            font: 900 2.8em 'Orbitron', sans-serif;
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(243, 186, 47, 0.8);
        }
        .hero p {
            color: #ccc;
            font-size: 1.3em;
            margin: 10px 0;
        }
        .countdown {
            color: var(--gold);
            font-size: 1.4em;
            margin: 20px 0;
            font-weight: 600;
        }
        .hero-buttons {
            display: flex;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .claim-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 16px 32px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 30px rgba(243, 186, 47, 0.4);
            min-width: 280px;
        }
        .how-btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 16px 24px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tx-popup {
            position: absolute;
            background: rgba(0,0,0,0.9);
            border: 1px solid var(--green);
            border-radius: 8px;
            padding: 10px 15px;
            color: var(--green);
            font-size: 0.9em;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tx-popup.show {
            opacity: 1;
        }
        .features {
            display: flex;
            justify-content: space-around;
            padding: 60px 20px;
            background: rgba(0,0,0,0.7);
            border-top: 1px solid var(--gold);
            position: relative;
            z-index: 10;
            flex-wrap: wrap;
            gap: 20px;
        }
        .feature {
            text-align: center;
            width: 22%;
            min-width: 140px;
        }
        .feature i {
            font-size: 2em;
            color: var(--gold);
            margin-bottom: 10px;
            display: block;
        }
        .feature h3 {
            font-size: 1em;
            margin-bottom: 8px;
            color: var(--gold);
        }
        .feature p {
            font-size: 0.8em;
            color: #999;
        }
        @media (max-width: 768px) {
            .hero-buttons { flex-direction: column; align-items: center; }
            .claim-btn, .how-btn { width: 80%; }
            .features { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

<div id="globe-container"></div>
<div class="overlay"></div>

<header>
    <div class="logo">
        <div class="coin">B</div>
        <span>BNB AIRDROP</span>
    </div>
    <nav>
        <a href="#" class="active">Web3 Home</a>
        <a href="airdrop.html" target="_blank">Airdrop</a>
        <a href="how.html" target="_blank">How It Works</a>
        <a href="tokenomics.html" target="_blank">Tokenomics</a>
        <a href="faq.html" target="_blank">FAQ</a>
    </nav>
    <button class="connect-btn" onclick="connectWallet()">
        <i class="fas fa-wallet"></i> Connect Wallet
    </button>
</header>

<section class="hero">
    <h1>BNB AIRDROP</h1>
    <p>Claim your free BNB tokens now</p>
    <div class="countdown" id="countdown">3d 14h 25m Time Left</div>

    <div class="hero-buttons">
        <button class="claim-btn" onclick="window.open('claim.html', '_blank')">
            <i class="fas fa-gift"></i> Claim Airdrop Now
        </button>
        <button class="how-btn" onclick="window.open('how.html', '_blank')">
            <i class="fas fa-play"></i> How It Works
        </button>
    </div>
</section>

<section class="features">
    <div class="feature">
        <i class="fas fa-shield-alt"></i>
        <h3>100% Legit & Secure</h3>
        <p>On-Chain Verified</p>
    </div>
    <div class="feature">
        <i class="fas fa-bolt"></i>
        <h3>Instant Distribution</h3>
        <p>Direct to Your Wallet</p>
    </div>
    <div class="feature">
        <i class="fas fa-infinity"></i>
        <h3>Web3 Powered</h3>
        <p>Decentralized & Transparent</p>
    </div>
    <div class="feature">
        <i class="fas fa-lock"></i>
        <h3>No KYC</h3>
        <p>Privacy First</p>
    </div>
</section>

<script>
    // === 3D GLOBE ===
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById("globe-container").appendChild(renderer.domElement);

    // Earth
    const geometry = new THREE.SphereGeometry(5, 64, 64);
    const textureLoader = new THREE.TextureLoader();
    const earthTexture = textureLoader.load("https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg");
    const bumpMap = textureLoader.load("https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_normal_2048.jpg");
    const material = new THREE.MeshPhongMaterial({
        map: earthTexture,
        bumpMap: bumpMap,
        bumpScale: 0.05,
        specular: new THREE.Color(0x333333)
    });
    const earth = new THREE.Mesh(geometry, material);
    scene.add(earth);

    // Glow
    const glowGeometry = new THREE.SphereGeometry(5.1, 64, 64);
    const glowMaterial = new THREE.MeshBasicMaterial({
        color: 0x00aaff,
        transparent: true,
        opacity: 0.2
    });
    const glow = new THREE.Mesh(glowGeometry, glowMaterial);
    scene.add(glow);

    camera.position.z = 8;

    // Cities (glowing points)
    const cities = [
        { lat: 40.7128, lon: -74.0060, name: "New York" },    // USA
        { lat: 35.6895, lon: 139.6917, name: "Tokyo" },       // Japan
        { lat: 51.5074, lon: -0.1278, name: "London" },       // UK
        { lat: 48.8566, lon: 2.3522, name: "Paris" },         // France
        { lat: 19.4326, lon: -99.1332, name: "Mexico City" }, // Mexico
        { lat: -23.5505, lon: -46.6333, name: "São Paulo" },  // Brazil
        { lat: 28.6139, lon: 77.2090, name: "Delhi" },        // India
        { lat: 31.2304, lon: 121.4737, name: "Shanghai" }     // China
    ];

    const cityPoints = [];
    cities.forEach(city => {
        const phi = (90 - city.lat) * Math.PI / 180;
        const theta = (city.lon + 180) * Math.PI / 180;
        const x = -5 * Math.sin(phi) * Math.cos(theta);
        const y = 5 * Math.cos(phi);
        const z = 5 * Math.sin(phi) * Math.sin(theta);

        const point = new THREE.Mesh(
            new THREE.SphereGeometry(0.08, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0x00ff00 })
        );
        point.position.set(x, y, z);
        scene.add(point);
        cityPoints.push({ point, city });
    });

    // Animated arrows between cities
    function createArrow(start, end) {
        const direction = new THREE.Vector3().subVectors(end, start);
        const length = direction.length();
        const arrow = new THREE.ArrowHelper(
            direction.normalize(),
            start,
            length,
            0x00aaff,
            0.2,
            0.1
        );
        scene.add(arrow);
        setTimeout(() => {
            scene.remove(arrow);
        }, 5000);
    }

    function randomTx() {
        const start = cityPoints[Math.floor(Math.random() * cityPoints.length)];
        let end;
        do {
            end = cityPoints[Math.floor(Math.random() * cityPoints.length)];
        } while (end === start);

        const startVec = start.point.position;
        const endVec = end.point.position;
        createArrow(startVec, endVec);

        // Fake TX popup
        const txHash = "0x" + Array(64).fill(0).map(() => Math.floor(Math.random() * 16).toString(16)).join('');
        const amount = (Math.random() * 0.9 + 0.1).toFixed(2);
        const popup = document.createElement("div");
        popup.className = "tx-popup";
        popup.innerHTML = `
            <strong>TX Confirmed</strong><br>
            ${amount} BNB → ${end.city.name}<br>
            <a href="https://bscscan.com/tx/${txHash}" target="_blank" style="color:#00ccff; text-decoration:underline;">${txHash.slice(0,8)}...${txHash.slice(-6)}</a>
        `;
        popup.style.left = Math.random() * 80 + 10 + "vw";
        popup.style.top = Math.random() * 60 + 20 + "vh";
        document.body.appendChild(popup);
        setTimeout(() => {
            popup.classList.add("show");
            setTimeout(() => {
                popup.classList.remove("show");
                setTimeout(() => popup.remove(), 300);
            }, 4000);
        }, 100);
    }

    // Random TX every 3 seconds
    setInterval(randomTx, 3000);
    setTimeout(() => setInterval(randomTx, 3000), 5000);

    function animate() {
        requestAnimationFrame(animate);
        earth.rotation.y += 0.001;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // === COUNTDOWN ===
    const endTime = new Date().getTime() + 3 * 86400000 + 14 * 3600000 + 25 * 60000;
    function updateCountdown() {
        const now = new Date().getTime();
        const diff = endTime - now;
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % 86400000) / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        document.getElementById("countdown").innerText = `${days}d ${hours}h ${mins}m Time Left`;
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // === WALLET CONNECT ===
    async function connectWallet() {
        if (typeof window.ethereum === "undefined") {
            alert("Please install MetaMask or Trust Wallet.");
            return;
        }
        try {
            await window.ethereum.request({ method: "eth_requestAccounts" });
            alert("✅ Wallet connected to global airdrop network.");
        } catch (err) {
            console.error(err);
        }
    }
</script>

</body>
</html>
